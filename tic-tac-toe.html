<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: clamp(1.2rem, 4vmin, 2.5rem);
      margin-bottom: 0.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e0e0e0;
    }

    #status {
      font-size: clamp(0.85rem, 2.5vmin, 1.2rem);
      margin-bottom: 0.75rem;
      height: 1.5em;
      color: #a0c4ff;
      font-weight: 600;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, min(22vmin, 110px));
      grid-template-rows: repeat(3, min(22vmin, 110px));
      gap: clamp(4px, 1vmin, 8px);
    }

    .cell {
      width: min(22vmin, 110px);
      height: min(22vmin, 110px);
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.8rem, 7vmin, 3.5rem);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #ff6b6b; }
    .cell.o { color: #4ecdc4; }

    .cell.winner {
      background: #0f3460;
      border-color: #a0c4ff;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(160, 196, 255, 0.4); }
      to   { box-shadow: 0 0 0 10px rgba(160, 196, 255, 0); }
    }

    #restart {
      margin-top: 2rem;
      padding: 0.7rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: #0f3460;
      color: #a0c4ff;
      border: 2px solid #a0c4ff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #restart:hover {
      background: #a0c4ff;
      color: #0f3460;
    }

    #score {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .score-item {
      text-align: center;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
    }

    .score-label { font-size: 0.75rem; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    .score-val   { font-size: 1.5rem; font-weight: bold; }
    .score-x     { color: #ff6b6b; }
    .score-o     { color: #4ecdc4; }
    .score-draw  { color: #aaa; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div id="score">
    <div class="score-item">
      <div class="score-label">X Wins</div>
      <div class="score-val score-x" id="score-x">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draws</div>
      <div class="score-val score-draw" id="score-draw">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">O Wins</div>
      <div class="score-val score-o" id="score-o">0</div>
    </div>
  </div>

  <div id="status">X's turn</div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <button id="restart">Restart</button>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board, current, over;
    const score = { X: 0, O: 0, D: 0 };

    const cells   = document.querySelectorAll('.cell');
    const status  = document.getElementById('status');
    const scoreX  = document.getElementById('score-x');
    const scoreO  = document.getElementById('score-o');
    const scoreDr = document.getElementById('score-draw');

    function init() {
      board   = Array(9).fill('');
      current = 'X';
      over    = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className   = 'cell';
      });
      status.textContent = "X's turn";
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(v => v)) return { winner: 'draw' };
      return null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (over || board[i]) return;

        board[i] = current;
        cell.textContent = current;
        cell.classList.add('taken', current.toLowerCase());

        const result = checkWinner();
        if (result) {
          over = true;
          if (result.winner === 'draw') {
            status.textContent = "It's a draw!";
            score.D++;
            scoreDr.textContent = score.D;
          } else {
            status.textContent = `${result.winner} wins!`;
            result.line.forEach(idx => cells[idx].classList.add('winner'));
            score[result.winner]++;
            scoreX.textContent = score.X;
            scoreO.textContent = score.O;
          }
        } else {
          current = current === 'X' ? 'O' : 'X';
          status.textContent = `${current}'s turn`;
        }
      });
    });

    document.getElementById('restart').addEventListener('click', init);

    init();
  </script>
</body>
</html>
