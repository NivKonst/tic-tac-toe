<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Park Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5b9bd5 0%, #87ceeb 50%, #6ab04c 85%, #4a8a30 100%);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: clamp(1rem, 3.5vmin, 2rem);
      margin-bottom: 0.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 2px 0 #c0392b, -1px -1px 0 #c0392b;
    }

    #status {
      font-size: clamp(0.8rem, 2.2vmin, 1.1rem);
      margin-bottom: 0.6rem;
      height: 1.6em;
      color: #fff;
      font-weight: 900;
      text-shadow: 1px 1px 0 #333;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, min(22vmin, 115px));
      grid-template-rows: repeat(3, min(22vmin, 115px));
      gap: clamp(4px, 1vmin, 8px);
      background: rgba(0,0,0,0.25);
      padding: clamp(6px, 1.5vmin, 12px);
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .cell {
      width: min(22vmin, 115px);
      height: min(22vmin, 115px);
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      padding: 5px;
    }

    .cell svg { width: 100%; height: 100%; }

    .cell:hover:not(.taken) {
      background: rgba(255,255,255,1);
      transform: scale(1.06);
    }

    .cell.taken { cursor: default; }

    .cell.winner {
      background: rgba(255,230,50,0.95);
      border-color: #f39c12;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(243,156,18,0.7); }
      to   { box-shadow: 0 0 0 12px rgba(243,156,18,0); }
    }

    #restart {
      margin-top: 0.8rem;
      padding: 0.5rem 1.8rem;
      font-size: clamp(0.75rem, 2vmin, 1rem);
      font-weight: 900;
      letter-spacing: 1px;
      background: #c0392b;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-transform: uppercase;
      font-family: 'Arial Black', sans-serif;
      text-shadow: 1px 1px 0 #000;
    }

    #restart:hover { background: #e74c3c; transform: scale(1.05); }

    #score {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 0.7rem;
    }

    .score-item {
      text-align: center;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 0.35rem 1rem;
      min-width: 80px;
    }

    .score-label { font-size: clamp(0.6rem, 1.5vmin, 0.75rem); color: #fff; letter-spacing: 1px; text-transform: uppercase; font-weight: 900; }
    .score-val   { font-size: clamp(1.2rem, 3vmin, 1.6rem); font-weight: 900; }
    .score-cartman { color: #e8c06a; }
    .score-stan    { color: #5dade2; }
    .score-draw    { color: #f9e79f; }
  </style>
</head>
<body>
  <h1>🏔 South Park Tic Tac Toe 🏔</h1>

  <div id="score">
    <div class="score-item">
      <div class="score-label">Cartman</div>
      <div class="score-val score-cartman" id="score-x">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draws</div>
      <div class="score-val score-draw" id="score-draw">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Stan</div>
      <div class="score-val score-stan" id="score-o">0</div>
    </div>
  </div>

  <div id="status">Cartman's turn</div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <button id="restart">New Game</button>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    /* ── CARTMAN ─────────────────────────────────────────────
       Tan dome hat, dark brim, chubby peach face, furrowed brows */
    const cartmanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Hat dome -->
      <path d="M21,49 Q18,10 50,10 Q82,10 79,49 Z"
            fill="#C9A96E" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Hat highlight -->
      <path d="M35,20 Q50,13 65,20 Q50,15 35,20 Z" fill="#DDBF82" opacity="0.5"/>
      <!-- Hat brim -->
      <rect x="15" y="45" width="70" height="9" rx="3"
            fill="#9E7535" stroke="#111" stroke-width="2"/>
      <!-- Chubby face -->
      <ellipse cx="50" cy="76" rx="33" ry="25"
               fill="#FDDBB4" stroke="#111" stroke-width="2.5"/>
      <!-- Side chub -->
      <ellipse cx="19" cy="76" rx="7.5" ry="10"
               fill="#FDDBB4" stroke="#111" stroke-width="1.8"/>
      <ellipse cx="81" cy="76" rx="7.5" ry="10"
               fill="#FDDBB4" stroke="#111" stroke-width="1.8"/>
      <!-- Cheek blush -->
      <ellipse cx="24" cy="79" rx="6" ry="4" fill="#f0a080" opacity="0.35"/>
      <ellipse cx="76" cy="79" rx="6" ry="4" fill="#f0a080" opacity="0.35"/>
      <!-- Eyes -->
      <ellipse cx="38" cy="70" rx="5.5" ry="6.5"
               fill="white" stroke="#111" stroke-width="1.5"/>
      <ellipse cx="62" cy="70" rx="5.5" ry="6.5"
               fill="white" stroke="#111" stroke-width="1.5"/>
      <circle cx="39" cy="71" r="3.2" fill="#111"/>
      <circle cx="63" cy="71" r="3.2" fill="#111"/>
      <circle cx="40" cy="70" r="1.1" fill="white"/>
      <circle cx="64" cy="70" r="1.1" fill="white"/>
      <!-- Furrowed eyebrows -->
      <path d="M29,60 Q38,54 47,60"
            stroke="#111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M53,60 Q62,54 71,60"
            stroke="#111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- Nose (small bump) -->
      <path d="M46,79 Q50,84 54,79"
            stroke="#c0845a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Mouth (smirk) -->
      <path d="M38,89 Q50,97 62,89"
            stroke="#111" stroke-width="2" fill="#CC7755" stroke-linejoin="round"/>
      <!-- Chin fat -->
      <ellipse cx="50" cy="98" rx="19" ry="5"
               fill="#FDDBB4" stroke="#111" stroke-width="1.5"/>
    </svg>`;

    /* ── STAN ────────────────────────────────────────────────
       Navy dome hat, white stripe, red brim & pompom, black hair */
    const stanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Pompom -->
      <circle cx="50" cy="8" r="9" fill="#CC1111" stroke="#111" stroke-width="2"/>
      <!-- Pompom texture lines -->
      <line x1="50" y1="1" x2="50" y2="15" stroke="#aa0000" stroke-width="1" opacity="0.4"/>
      <line x1="43" y1="4" x2="57" y2="12" stroke="#aa0000" stroke-width="1" opacity="0.4"/>
      <line x1="43" y1="12" x2="57" y2="4" stroke="#aa0000" stroke-width="1" opacity="0.4"/>
      <!-- Hat dome (navy) -->
      <path d="M19,50 Q18,14 50,14 Q82,14 81,50 Z"
            fill="#1C2F82" stroke="#111" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Hat dome highlight -->
      <path d="M35,22 Q50,15 65,22 Q50,17 35,22 Z" fill="#2a40a8" opacity="0.5"/>
      <!-- White stripe -->
      <rect x="18" y="42" width="64" height="6" fill="white" stroke="#ddd" stroke-width="0.5"/>
      <!-- Red brim -->
      <rect x="14" y="47" width="72" height="8" rx="3"
            fill="#CC1111" stroke="#111" stroke-width="2"/>
      <!-- Black hair sides -->
      <ellipse cx="16" cy="70" rx="9.5" ry="14"
               fill="#1a1a1a" stroke="#111" stroke-width="1.5"/>
      <ellipse cx="84" cy="70" rx="9.5" ry="14"
               fill="#1a1a1a" stroke="#111" stroke-width="1.5"/>
      <!-- Face -->
      <ellipse cx="50" cy="74" rx="30" ry="25"
               fill="#FDDBB4" stroke="#111" stroke-width="2.5"/>
      <!-- Eyes -->
      <ellipse cx="39" cy="68" rx="5.5" ry="6.5"
               fill="white" stroke="#111" stroke-width="1.5"/>
      <ellipse cx="61" cy="68" rx="5.5" ry="6.5"
               fill="white" stroke="#111" stroke-width="1.5"/>
      <circle cx="40" cy="69" r="3.2" fill="#111"/>
      <circle cx="62" cy="69" r="3.2" fill="#111"/>
      <circle cx="41" cy="68" r="1.1" fill="white"/>
      <circle cx="63" cy="68" r="1.1" fill="white"/>
      <!-- Eyebrows (neutral/friendly) -->
      <path d="M32,57 Q39,53 46,57"
            stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M54,57 Q61,53 68,57"
            stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Nose -->
      <path d="M46,77 Q50,82 54,77"
            stroke="#c0845a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Smile -->
      <path d="M38,86 Q50,96 62,86"
            stroke="#111" stroke-width="2" fill="#CC7755" stroke-linejoin="round"/>
    </svg>`;

    let board, current, over;
    const score = { X: 0, O: 0, D: 0 };

    const cells   = document.querySelectorAll('.cell');
    const status  = document.getElementById('status');
    const scoreX  = document.getElementById('score-x');
    const scoreO  = document.getElementById('score-o');
    const scoreDr = document.getElementById('score-draw');

    function init() {
      board   = Array(9).fill('');
      current = 'X';
      over    = false;
      cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });
      status.textContent = "Cartman's turn";
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c])
          return { winner: board[a], line: [a, b, c] };
      }
      if (board.every(v => v)) return { winner: 'draw' };
      return null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (over || board[i]) return;

        board[i] = current;
        cell.innerHTML = current === 'X' ? cartmanSVG : stanSVG;
        cell.classList.add('taken', current.toLowerCase());

        const result = checkWinner();
        if (result) {
          over = true;
          if (result.winner === 'draw') {
            status.textContent = "It's a draw! Oh my God!";
            score.D++;
            scoreDr.textContent = score.D;
          } else {
            const name = result.winner === 'X' ? 'Cartman' : 'Stan';
            status.textContent = result.winner === 'X'
              ? "Cartman wins! Respect my authoritah!"
              : "Stan wins! Oh my God, Stan won!";
            result.line.forEach(idx => cells[idx].classList.add('winner'));
            score[result.winner]++;
            scoreX.textContent = score.X;
            scoreO.textContent = score.O;
          }
        } else {
          current = current === 'X' ? 'O' : 'X';
          status.textContent = current === 'X' ? "Cartman's turn" : "Stan's turn";
        }
      });
    });

    document.getElementById('restart').addEventListener('click', init);
    init();
  </script>
</body>
</html>
