<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Park Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5b9bd5 0%, #87ceeb 50%, #6ab04c 85%, #4a8a30 100%);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: clamp(1rem, 3.5vmin, 2rem);
      margin-bottom: 0.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 2px 0 #c0392b, -1px -1px 0 #c0392b;
    }

    #status {
      font-size: clamp(0.8rem, 2.2vmin, 1.1rem);
      margin-bottom: 0.6rem;
      height: 1.6em;
      color: #fff;
      font-weight: 900;
      text-shadow: 1px 1px 0 #333;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, min(22vmin, 115px));
      grid-template-rows: repeat(3, min(22vmin, 115px));
      gap: clamp(4px, 1vmin, 8px);
      background: rgba(0,0,0,0.25);
      padding: clamp(6px, 1.5vmin, 12px);
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .cell {
      width: min(22vmin, 115px);
      height: min(22vmin, 115px);
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      padding: 5px;
    }

    .cell svg { width: 100%; height: 100%; }

    .cell:hover:not(.taken) {
      background: rgba(255,255,255,1);
      transform: scale(1.06);
    }

    .cell.taken { cursor: default; }

    .cell.winner {
      background: rgba(255,230,50,0.95);
      border-color: #f39c12;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(243,156,18,0.7); }
      to   { box-shadow: 0 0 0 12px rgba(243,156,18,0); }
    }

    #restart {
      margin-top: 0.8rem;
      padding: 0.5rem 1.8rem;
      font-size: clamp(0.75rem, 2vmin, 1rem);
      font-weight: 900;
      letter-spacing: 1px;
      background: #c0392b;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-transform: uppercase;
      font-family: 'Arial Black', sans-serif;
      text-shadow: 1px 1px 0 #000;
    }

    #restart:hover { background: #e74c3c; transform: scale(1.05); }

    #score {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 0.7rem;
    }

    .score-item {
      text-align: center;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 0.35rem 1rem;
      min-width: 80px;
    }

    .score-label { font-size: clamp(0.6rem, 1.5vmin, 0.75rem); color: #fff; letter-spacing: 1px; text-transform: uppercase; font-weight: 900; }
    .score-val   { font-size: clamp(1.2rem, 3vmin, 1.6rem); font-weight: 900; }
    .score-cartman { color: #e8c06a; }
    .score-stan    { color: #5dade2; }
    .score-draw    { color: #f9e79f; }
  </style>
</head>
<body>
  <h1>🏔 South Park Tic Tac Toe 🏔</h1>

  <div id="score">
    <div class="score-item">
      <div class="score-label">Cartman</div>
      <div class="score-val score-cartman" id="score-x">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draws</div>
      <div class="score-val score-draw" id="score-draw">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Stan</div>
      <div class="score-val score-stan" id="score-o">0</div>
    </div>
  </div>

  <div id="status">Cartman's turn</div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <button id="restart">New Game</button>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    /* ── CARTMAN ─────────────────────────────────────────────
       South Park accurate: flat tan beanie, fat round face, V-brows */
    const cartmanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Hat dome: flat tan/beige, no highlights -->
      <path d="M20,51 Q18,10 50,10 Q82,10 80,51 Z"
            fill="#C8A045" stroke="#000" stroke-width="2.5"/>
      <!-- Hat brim: darker brown band -->
      <rect x="14" y="46" width="72" height="10" rx="4"
            fill="#7B4D10" stroke="#000" stroke-width="2.5"/>
      <!-- Chubby face (wider than tall, very round) -->
      <ellipse cx="50" cy="77" rx="36" ry="24"
               fill="#FCCF9D" stroke="#000" stroke-width="2.5"/>
      <!-- Extra fat cheek sides -->
      <ellipse cx="16" cy="77" rx="9" ry="13"
               fill="#FCCF9D" stroke="#000" stroke-width="2"/>
      <ellipse cx="84" cy="77" rx="9" ry="13"
               fill="#FCCF9D" stroke="#000" stroke-width="2"/>
      <!-- Rosy cheeks -->
      <ellipse cx="23" cy="83" rx="9" ry="5" fill="#E08866" opacity="0.28"/>
      <ellipse cx="77" cy="83" rx="9" ry="5" fill="#E08866" opacity="0.28"/>
      <!-- Eyes: small and beady -->
      <ellipse cx="37" cy="71" rx="6" ry="7"
               fill="white" stroke="#000" stroke-width="2"/>
      <ellipse cx="63" cy="71" rx="6" ry="7"
               fill="white" stroke="#000" stroke-width="2"/>
      <circle cx="38.5" cy="72" r="3.5" fill="#000"/>
      <circle cx="64.5" cy="72" r="3.5" fill="#000"/>
      <circle cx="40" cy="70.5" r="1.2" fill="white"/>
      <circle cx="66" cy="70.5" r="1.2" fill="white"/>
      <!-- Angry V-shaped furrowed brows (Cartman's signature) -->
      <line x1="25" y1="61" x2="46" y2="66"
            stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <line x1="54" y1="66" x2="75" y2="61"
            stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <!-- Nose -->
      <path d="M46,81 Q50,87 54,81"
            stroke="#B07060" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- Smug smirk -->
      <path d="M36,91 Q50,100 64,91"
            stroke="#000" stroke-width="2.5" fill="#CC6644"/>
    </svg>`;

    /* ── STAN ────────────────────────────────────────────────
       South Park accurate: navy dome, white stripe, red brim+pompom, black hair */
    const stanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Red pompom -->
      <circle cx="50" cy="9" r="9" fill="#CC1111" stroke="#000" stroke-width="2.5"/>
      <!-- Hat dome: flat navy blue, no highlights -->
      <path d="M19,51 Q17,15 50,15 Q83,15 81,51 Z"
            fill="#1C2E82" stroke="#000" stroke-width="2.5"/>
      <!-- White stripe near brim -->
      <rect x="18" y="43" width="64" height="7" fill="white" stroke="none"/>
      <!-- Red brim/cuff -->
      <rect x="13" y="48" width="74" height="9" rx="4"
            fill="#CC1111" stroke="#000" stroke-width="2.5"/>
      <!-- Black hair poking out sides -->
      <ellipse cx="13" cy="72" rx="10" ry="15"
               fill="#1A1A1A" stroke="#000" stroke-width="2"/>
      <ellipse cx="87" cy="72" rx="10" ry="15"
               fill="#1A1A1A" stroke="#000" stroke-width="2"/>
      <!-- Face: normal round proportions -->
      <ellipse cx="50" cy="76" rx="31" ry="24"
               fill="#FCCF9D" stroke="#000" stroke-width="2.5"/>
      <!-- Eyes -->
      <ellipse cx="38" cy="69" rx="5.5" ry="6.5"
               fill="white" stroke="#000" stroke-width="2"/>
      <ellipse cx="62" cy="69" rx="5.5" ry="6.5"
               fill="white" stroke="#000" stroke-width="2"/>
      <circle cx="39.5" cy="70" r="3.2" fill="#000"/>
      <circle cx="63.5" cy="70" r="3.2" fill="#000"/>
      <circle cx="41" cy="68.5" r="1.1" fill="white"/>
      <circle cx="65" cy="68.5" r="1.1" fill="white"/>
      <!-- Neutral brows (slight inner raise — Stan's concerned look) -->
      <path d="M30,58 Q38,53 46,58"
            stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M54,58 Q62,53 70,58"
            stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Nose -->
      <path d="M46,79 Q50,84 54,79"
            stroke="#B07060" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- Friendly slight smile -->
      <path d="M38,89 Q50,98 62,89"
            stroke="#000" stroke-width="2.5" fill="#CC6644"/>
    </svg>`;

    let board, current, over;
    const score = { X: 0, O: 0, D: 0 };

    const cells   = document.querySelectorAll('.cell');
    const status  = document.getElementById('status');
    const scoreX  = document.getElementById('score-x');
    const scoreO  = document.getElementById('score-o');
    const scoreDr = document.getElementById('score-draw');

    function init() {
      board   = Array(9).fill('');
      current = 'X';
      over    = false;
      cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });
      status.textContent = "Cartman's turn";
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c])
          return { winner: board[a], line: [a, b, c] };
      }
      if (board.every(v => v)) return { winner: 'draw' };
      return null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (over || board[i]) return;

        board[i] = current;
        cell.innerHTML = current === 'X' ? cartmanSVG : stanSVG;
        cell.classList.add('taken', current.toLowerCase());

        const result = checkWinner();
        if (result) {
          over = true;
          if (result.winner === 'draw') {
            status.textContent = "It's a draw! Oh my God!";
            score.D++;
            scoreDr.textContent = score.D;
          } else {
            const name = result.winner === 'X' ? 'Cartman' : 'Stan';
            status.textContent = result.winner === 'X'
              ? "Cartman wins! Respect my authoritah!"
              : "Stan wins! Oh my God, Stan won!";
            result.line.forEach(idx => cells[idx].classList.add('winner'));
            score[result.winner]++;
            scoreX.textContent = score.X;
            scoreO.textContent = score.O;
          }
        } else {
          current = current === 'X' ? 'O' : 'X';
          status.textContent = current === 'X' ? "Cartman's turn" : "Stan's turn";
        }
      });
    });

    document.getElementById('restart').addEventListener('click', init);
    init();
  </script>
</body>
</html>
