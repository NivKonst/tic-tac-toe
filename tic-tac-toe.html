<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Park Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #5b9bd5 0%, #87ceeb 50%, #6ab04c 85%, #4a8a30 100%);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: clamp(1rem, 3.5vmin, 2rem);
      margin-bottom: 0.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 2px 2px 0 #c0392b, -1px -1px 0 #c0392b;
    }

    #status {
      font-size: clamp(0.8rem, 2.2vmin, 1.1rem);
      margin-bottom: 0.6rem;
      height: 1.6em;
      color: #fff;
      font-weight: 900;
      text-shadow: 1px 1px 0 #333;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, min(22vmin, 115px));
      grid-template-rows: repeat(3, min(22vmin, 115px));
      gap: clamp(4px, 1vmin, 8px);
      background: rgba(0,0,0,0.25);
      padding: clamp(6px, 1.5vmin, 12px);
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.4);
    }

    .cell {
      width: min(22vmin, 115px);
      height: min(22vmin, 115px);
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
      padding: 6px;
    }

    .cell svg {
      width: 100%;
      height: 100%;
    }

    .cell:hover:not(.taken) {
      background: rgba(255,255,255,1);
      transform: scale(1.06);
    }

    .cell.taken { cursor: default; }

    .cell.winner {
      background: rgba(255,230,50,0.95);
      border-color: #f39c12;
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.7); }
      to   { box-shadow: 0 0 0 12px rgba(243, 156, 18, 0); }
    }

    #restart {
      margin-top: 0.8rem;
      padding: 0.5rem 1.8rem;
      font-size: clamp(0.75rem, 2vmin, 1rem);
      font-weight: 900;
      letter-spacing: 1px;
      background: #c0392b;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      text-transform: uppercase;
      font-family: 'Arial Black', sans-serif;
      text-shadow: 1px 1px 0 #000;
    }

    #restart:hover {
      background: #e74c3c;
      transform: scale(1.05);
    }

    #score {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 0.7rem;
    }

    .score-item {
      text-align: center;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 10px;
      padding: 0.35rem 1rem;
      min-width: 80px;
    }

    .score-label {
      font-size: clamp(0.6rem, 1.5vmin, 0.75rem);
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .score-val {
      font-size: clamp(1.2rem, 3vmin, 1.6rem);
      font-weight: 900;
    }

    .score-cartman { color: #e74c3c; }
    .score-stan    { color: #5dade2; }
    .score-draw    { color: #f9e79f; }
  </style>
</head>
<body>
  <h1>🏔 South Park Tic Tac Toe 🏔</h1>

  <div id="score">
    <div class="score-item">
      <div class="score-label">Cartman</div>
      <div class="score-val score-cartman" id="score-x">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Draws</div>
      <div class="score-val score-draw" id="score-draw">0</div>
    </div>
    <div class="score-item">
      <div class="score-label">Stan</div>
      <div class="score-val score-stan" id="score-o">0</div>
    </div>
  </div>

  <div id="status">Cartman's turn</div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <button id="restart">New Game</button>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    const cartmanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Hat (beige/tan) -->
      <ellipse cx="50" cy="29" rx="31" ry="19" fill="#D4B896"/>
      <!-- Hat band (brown) -->
      <rect x="21" y="38" width="58" height="7" fill="#8B6340" rx="1"/>
      <!-- Face (chubby) -->
      <ellipse cx="50" cy="68" rx="35" ry="30" fill="#FECBA1"/>
      <!-- Chin fat -->
      <ellipse cx="50" cy="93" rx="22" ry="8" fill="#FECBA1"/>
      <!-- Chubby cheeks -->
      <ellipse cx="19" cy="71" rx="8" ry="7" fill="#f4a87c" opacity="0.55"/>
      <ellipse cx="81" cy="71" rx="8" ry="7" fill="#f4a87c" opacity="0.55"/>
      <!-- Eyes -->
      <circle cx="39" cy="62" r="5" fill="white"/>
      <circle cx="61" cy="62" r="5" fill="white"/>
      <circle cx="40" cy="63" r="3" fill="#111"/>
      <circle cx="62" cy="63" r="3" fill="#111"/>
      <circle cx="41" cy="62" r="1" fill="white"/>
      <circle cx="63" cy="62" r="1" fill="white"/>
      <!-- Furrowed eyebrows -->
      <path d="M31 53 Q39 48 47 53" stroke="#5a3320" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M53 53 Q61 48 69 53" stroke="#5a3320" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Nose -->
      <ellipse cx="50" cy="71" rx="4" ry="3" fill="#e8a070"/>
      <!-- Smirk mouth -->
      <path d="M39 80 Q50 88 61 80" stroke="#5a3320" stroke-width="2" fill="#d96a50" stroke-linejoin="round"/>
    </svg>`;

    const stanSVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Pompom -->
      <circle cx="50" cy="7" r="10" fill="#c0392b"/>
      <!-- Hat (blue) -->
      <ellipse cx="50" cy="27" rx="32" ry="20" fill="#1a5276"/>
      <!-- Hat band (red) -->
      <rect x="20" y="38" width="60" height="9" fill="#c0392b" rx="1"/>
      <!-- White stripe on band -->
      <rect x="20" y="41" width="60" height="3" fill="rgba(255,255,255,0.3)" rx="1"/>
      <!-- Black hair (sides) -->
      <ellipse cx="20" cy="67" rx="10" ry="14" fill="#1a1a1a"/>
      <ellipse cx="80" cy="67" rx="10" ry="14" fill="#1a1a1a"/>
      <!-- Face -->
      <ellipse cx="50" cy="66" rx="29" ry="27" fill="#FECBA1"/>
      <!-- Eyes -->
      <circle cx="40" cy="61" r="5" fill="white"/>
      <circle cx="60" cy="61" r="5" fill="white"/>
      <circle cx="41" cy="62" r="3" fill="#111"/>
      <circle cx="61" cy="62" r="3" fill="#111"/>
      <circle cx="42" cy="61" r="1" fill="white"/>
      <circle cx="62" cy="61" r="1" fill="white"/>
      <!-- Eyebrows (neutral/friendly) -->
      <path d="M34 52 Q40 49 46 52" stroke="#5a3320" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M54 52 Q60 49 66 52" stroke="#5a3320" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Nose -->
      <ellipse cx="50" cy="69" rx="3.5" ry="2.5" fill="#e8a070"/>
      <!-- Smile -->
      <path d="M39 77 Q50 87 61 77" stroke="#5a3320" stroke-width="2" fill="#d96a50" stroke-linejoin="round"/>
    </svg>`;

    let board, current, over;
    const score = { X: 0, O: 0, D: 0 };

    const cells   = document.querySelectorAll('.cell');
    const status  = document.getElementById('status');
    const scoreX  = document.getElementById('score-x');
    const scoreO  = document.getElementById('score-o');
    const scoreDr = document.getElementById('score-draw');

    function init() {
      board   = Array(9).fill('');
      current = 'X';
      over    = false;
      cells.forEach(c => {
        c.innerHTML = '';
        c.className = 'cell';
      });
      status.textContent = "Cartman's turn";
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return { winner: board[a], line: [a, b, c] };
        }
      }
      if (board.every(v => v)) return { winner: 'draw' };
      return null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (over || board[i]) return;

        board[i] = current;
        cell.innerHTML = current === 'X' ? cartmanSVG : stanSVG;
        cell.classList.add('taken', current.toLowerCase());

        const result = checkWinner();
        if (result) {
          over = true;
          if (result.winner === 'draw') {
            status.textContent = "It's a draw! Oh my God!";
            score.D++;
            scoreDr.textContent = score.D;
          } else {
            const name = result.winner === 'X' ? 'Cartman' : 'Stan';
            status.textContent = `${name} wins! Respect my authoritah!`;
            result.line.forEach(idx => cells[idx].classList.add('winner'));
            score[result.winner]++;
            scoreX.textContent = score.X;
            scoreO.textContent = score.O;
          }
        } else {
          current = current === 'X' ? 'O' : 'X';
          status.textContent = current === 'X' ? "Cartman's turn" : "Stan's turn";
        }
      });
    });

    document.getElementById('restart').addEventListener('click', init);

    init();
  </script>
</body>
</html>
